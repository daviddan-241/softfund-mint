<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softfund NFT Mint</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family: 'Montserrat', sans-serif;
    background-color: #121212;
    color: #EAEAEA;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    background-color:#1a1a1a;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    width:360px;
    text-align:center;
}

h1 { color:#00FFAA; margin-bottom:15px; }
p { margin-bottom:15px; }

.hero-image {
    width:100%;
    border-radius:12px;
    margin-bottom:20px;
    border:2px solid #00FFAA;
}

button {
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-weight:bold;
    transition: all 0.2s;
}

#connectBtn { background:#FF6F61; color:white; }
#connectBtn:hover { background:#FF5A4D; }

#mintBtn { background:#00FFAA; color:#121212; }
#mintBtn:hover { background:#00CC88; }

input {
    width:60px;
    padding:8px;
    margin-right:10px;
    border-radius:6px;
    border:1px solid #00FFAA;
    text-align:center;
    background:#1a1a1a;
    color:#EAEAEA;
}

#status { margin-bottom:15px; font-weight:bold; color:#FF6F61; }

#metadataList {
    text-align:left;
    max-height:200px;
    overflow-y:auto;
    margin-top:15px;
    font-size:0.9em;
}

#metadataList li {
    border-bottom:1px solid #00FFAA;
    padding:5px 0;
}
</style>
</head>
<body>

<div class="container">
  <h1>Softfund Exclusive NFT Drop</h1>
  <!-- Updated Hero Image -->
  <img src="https://gateway.lighthouse.storage/ipfs/bafkreidstjrabmghkjqwjcpct24g67flpybxs6gd7vpcg724upwibpy4le" alt="Softfund #1" class="hero-image">
  <p id="status">Connect your wallet to mint your Softfund NFT!</p>

  <div id="walletButtons"></div>

  <div id="mintSection" style="display:none;">
    <p>Connected Wallet: <span id="walletAddress"></span></p>
    <label>Quantity:</label>
    <input type="number" id="quantity" value="1" min="1" max="25">
    <button id="mintBtn">Mint NFT ($2.672 each)</button>

    <ul id="metadataList"></ul>
  </div>
</div>

<script type="module">
import { Connection, PublicKey, Transaction, SystemProgram, LAMPORTS_PER_SOL } from "https://cdn.jsdelivr.net/npm/@solana/web3.js@1.72.0/dist/web3.min.js";

// CONFIG
const CONFIG = {
    TREASURY_WALLET: "6v4DR5rkDFa3WdCQ35wvtfVYfk7i233Uiu6GmQ7JCdRu",
    PRICE_USD: 2.672,
    MAX_SUPPLY: 25,
    METADATA_CIDS: [
        "bafkreidstjrabmghkjqwjcpct24g67flpybxs6gd7vpcg724upwibpy4le",
        "bafkreihhs2kunfn4dvwundezfqyksisjlqlrsqm77rypz6c7dmhwu3uy5y",
        "bafkreibiip2mn32hvppk4fpfcbob4rszyiamru5mazdpcbanihfylhnami",
        "bafkreidxd6q6vtpwboxr5eokewalr3ie7xmxjocny5m2ft66fayo5cd6im",
        "bafkreidiimwvc36ekicyuxugmo7wcsdhvye3l3fz4l34lvs3lf44tsrqra"
        // Add more CIDs up to 25
    ]
};

let totalMinted = parseInt(localStorage.getItem("softfundMinted") || "0");

const statusEl = document.getElementById("status");
const walletAddressSpan = document.getElementById("walletAddress");
const mintBtn = document.getElementById("mintBtn");
const quantityInput = document.getElementById("quantity");
const mintSection = document.getElementById("mintSection");
const metadataList = document.getElementById("metadataList");

// Populate metadata list
CONFIG.METADATA_CIDS.forEach((cid, idx) => {
    const li = document.createElement("li");
    li.innerHTML = `Softfund #${idx+1}: <a href="https://gateway.lighthouse.storage/ipfs/${cid}" target="_blank">View</a>`;
    metadataList.appendChild(li);
});

// WALLET CONNECT
async function connectWallet() {
    if (!window.solana) {
        alert("Please install a Solana wallet (Phantom / Solflare / Trust Wallet)");
        return;
    }
    try {
        const resp = await window.solana.connect();
        walletAddressSpan.textContent = resp.publicKey.toString();
        statusEl.textContent = "Wallet connected! Ready to mint.";
        mintSection.style.display = "block";
    } catch (err) {
        statusEl.textContent = "Wallet connection failed.";
    }
}

const walletButtonsDiv = document.getElementById("walletButtons");
const connectBtn = document.createElement("button");
connectBtn.id = "connectBtn";
connectBtn.innerText = "Connect Wallet";
connectBtn.onclick = connectWallet;
walletButtonsDiv.appendChild(connectBtn);

// MINT LOGIC
mintBtn.onclick = async () => {
    const qty = parseInt(quantityInput.value);
    if (totalMinted + qty > CONFIG.MAX_SUPPLY) {
        alert("Exceeds max supply!");
        return;
    }

    // Approx USD → SOL (adjust exchange rate manually)
    const solAmount = (CONFIG.PRICE_USD * qty) / 30; // e.g., 1 SOL = $30

    const tx = new Transaction().add(
        SystemProgram.transfer({
            fromPubkey: window.solana.publicKey,
            toPubkey: new PublicKey(CONFIG.TREASURY_WALLET),
            lamports: Math.floor(solAmount * LAMPORTS_PER_SOL),
        })
    );

    try {
        statusEl.textContent = "Transaction in progress...";
        const sig = await window.solana.sendTransaction(tx, window.solana);
        await window.solana.confirmTransaction(sig);
        totalMinted += qty;
        localStorage.setItem("softfundMinted", totalMinted);
        alert(`Minted ${qty} NFT(s)! Transaction: ${sig}`);
        statusEl.textContent = "Mint successful!";
    } catch (err) {
        statusEl.textContent = "Transaction failed: " + err.message;
    }
};
</script>
</body>
</html>
