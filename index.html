<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Softfund (STFD) — Mint</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f1a;--card:#121226;--accent:#00d4ff;--text:#e6eefc;--muted:#9fb0c8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#0f0f1a,#0b1230);color:var(--text);padding:18px;min-height:100vh}
.container{max-width:920px;margin:20px auto;background:var(--card);border-radius:14px;padding:18px;border:1px solid rgba(0,212,255,0.06);box-shadow:0 12px 30px rgba(0,0,0,0.5)}
.row{display:flex;gap:20px;flex-wrap:wrap}
.left{flex:0 0 360px}.right{flex:1}
h1{text-align:center;margin-bottom:8px;font-weight:700}
.hero img{width:100%;border-radius:10px;display:block;object-fit:cover}
.controls{margin-top:12px}
.btn{background:linear-gradient(90deg,#00d4ff,#00ffa0);border:none;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;color:#000}
.small{font-size:0.9rem;color:var(--muted)}
.addr{font-family:monospace;color:#7ff}
.qty-btn{width:44px;height:44px;border-radius:10px;border:1px solid rgba(0,212,255,0.08);background:rgba(0,212,255,0.02);color:var(--accent);font-size:20px;cursor:pointer}
#quantity{display:inline-block;width:48px;text-align:center;font-weight:800;color:#fff}
.progress{height:10px;background:rgba(255,255,255,0.04);border-radius:6px;overflow:hidden;margin-top:12px}
.progress-bar{height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);width:0%;transition:width .8s}
.gallery{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{background:rgba(255,255,255,0.02);border-radius:8px;padding:8px;text-align:center}
.tile img{width:100%;height:90px;object-fit:cover;border-radius:6px}
.sold{color:#ff6b6b;font-weight:800;font-size:1.05rem;margin-top:12px}
.copy-btn{margin-left:8px;padding:6px 8px;border-radius:8px;background:#00d4ff;color:#000;border:none;cursor:pointer}
.canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.wallet-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:1000}
.wallet-modal-content{background:#121226;padding:20px;border-radius:14px;display:flex;flex-direction:column;gap:10px}
.wallet-option{padding:10px;border-radius:10px;background:linear-gradient(90deg,#00d4ff,#00ffa0);text-align:center;font-weight:700;color:#000;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <h1>Softfund (STFD)</h1>
  <div class="row">
    <div class="left">
      <div class="hero">
        <img id="heroImg" src="https://ipfs.io/ipfs/bafkreidiimwvc36ekicyuxugmo7wcsdhvye3l3fz4l34lvs3lf44tsrqra" alt="hero image">
      </div>
      <div class="controls">
        <div class="small">Price per STFD: <strong>$3.20</strong></div>
        <div style="margin-top:12px">
          <div class="small">Quantity</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            <button class="qty-btn" id="dec">−</button>
            <div id="quantity">1</div>
            <button class="qty-btn" id="inc">+</button>
          </div>
        </div>
        <div style="margin-top:12px" class="small">
          Total: $<span id="totalUSD">3.200</span> USD ≈ <span id="totalSOL">—</span> SOL
        </div>
        <div style="margin-top:12px">
          <button id="mintBtn" class="btn">MINT</button>
        </div>
        <div id="connectNotice" style="display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.2);color:#9fb0c8;font-size:0.9rem;word-break:break-word;">
          Wallet not detected. Open this page inside <strong>Phantom</strong> or open with <strong>Phantom extension</strong> on desktop.<br>
          <a href="https://softfund-minter.vercel.app/" target="_blank" style="color:#00d4ff;text-decoration:underline;">https://softfund-minter.vercel.app/</a>
          <button id="copyLink" style="margin-left:8px;padding:4px 8px;border:none;border-radius:6px;background:#00d4ff;color:#000;cursor:pointer;font-weight:600;">Copy</button>
        </div>
      </div>
    </div>
    <div class="right">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:800">Recent mints</div>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/@solana/web3.js@1.72.0/lib/index.iife.min.js"></script>
<script>
const { Connection, PublicKey, SystemProgram, Transaction, LAMPORTS_PER_SOL } = window.solanaWeb3;
const connection = new Connection('https://api.mainnet-beta.solana.com', 'confirmed');
const TREASURY = '3GM4KD2PJvmqx1MeMgT65Gkq7qqWu9bo9TpTcGgpyTPc';
const PRICE_USD = 3.20;
let SOL_PRICE = 150;
let provider = null;const mintBtn = document.getElementById('mintBtn'); const connectNotice = document.getElementById('connectNotice'); const copyLink = document.getElementById('copyLink'); const totalUSDEl = document.getElementById('totalUSD'); const totalSOLEl = document.getElementById('totalSOL');

async function fetchSOLPrice(){ try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd');const j=await r.json();if(j.solana?.usd)SOL_PRICE=j.solana.usd;}catch(e){console.warn(e);}updateTotal();}

function updateTotal(){const totalUSD=parseFloat(totalUSDEl.textContent);const totalSOL=totalUSD/SOL_PRICE;totalSOLEl.textContent=totalSOL.toFixed(6);}

copyLink.addEventListener('click',()=>{navigator.clipboard.writeText('https://softfund-minter.vercel.app/').then(()=>alert('Link copied'));});

document.getElementById('dec').onclick=()=>{const q=document.getElementById('quantity');let n=parseInt(q.textContent);if(n>1){q.textContent=--n;updateTotal();}}; document.getElementById('inc').onclick=()=>{const q=document.getElementById('quantity');let n=parseInt(q.textContent);if(n<10){q.textContent=++n;updateTotal();}};

async function connectWallet(){ if(window.solana && window.solana.isPhantom){ try{await window.solana.connect();provider=window.solana;connectNotice.style.display='none';} catch(e){connectNotice.style.display='block';} }else{ connectNotice.style.display='block'; } }

mintBtn.addEventListener('click',async()=>{ await connectWallet(); if(!provider||!provider.publicKey){return;} const quantity=parseInt(document.getElementById('quantity').textContent); const totalUSD=PRICE_USDquantity; const totalSOL=totalUSD/SOL_PRICE; const lamports=Math.round(totalSOLLAMPORTS_PER_SOL); if(!confirm(Send ${totalSOL.toFixed(6)} SOL to treasury? Approve in wallet.))return; try{ const fromPubkey=provider.publicKey; const toPubkey=new PublicKey(TREASURY); const tx=new Transaction().add(SystemProgram.transfer({fromPubkey,toPubkey,lamports})); tx.feePayer=fromPubkey; tx.recentBlockhash=(await connection.getLatestBlockhash()).blockhash; const signed=await provider.signTransaction(tx); const raw=signed.serialize(); const sig=await connection.sendRawTransaction(raw); await connection.confirmTransaction(sig,'confirmed'); alert('Transaction confirmed: '+sig); }catch(e){console.error(e);alert('Transaction failed');} });

fetchSOLPrice(); </script>

</body>
</html>
