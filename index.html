<html lang="en">
<head>

<title>Softfund NFT Mint</title>
<style>
  body { font-family: Arial; background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh; }

  button { padding:10px 20px; margin:10px; cursor:pointer; background-color:#1e40af; color:white; border:none; border-radius:6px; }

  <p id="status">Connect your wallet to start minting</p>
  <div id="walletButtons"></div>
  <div id="mintSection" style="display:none;">
    <p>Connected: <span id="walletAddress"></span></p>
    <label>Quantity:</label>
    <input type="number" id="quantity" value="1" min="1" max="10000">
    <button id="mintBtn">Mint NFT ($2.672 each)</button>

  ]
};

let totalMinted = parseInt(localStorage.getItem("softfundMinted") || "0");

const statusEl = document.getElementById("status");
const walletAddressSpan = document.getElementById("walletAddress");
const mintBtn = document.getElementById("mintBtn");
const quantityInput = document.getElementById("quantity");
const mintSection = document.getElementById("mintSection");

// Connect wallet
async function connectWallet() {
  if (!window.solana) {
    alert("Please install a Solana wallet (Phantom / Trust Wallet / Solflare)");
    return;
  }
  const resp = await window.solana.connect();
  walletAddressSpan.textContent = resp.publicKey.toString();
  statusEl.textContent = "Wallet connected!";
  mintSection.style.display = "block";
}
const walletButtonsDiv = document.getElementById("walletButtons");
const connectBtn = document.createElement("button");
connectBtn.innerText = "Connect Wallet";
connectBtn.onclick = connectWallet;
walletButtonsDiv.appendChild(connectBtn);

// Minting
mintBtn.onclick = async () => {
  const qty = parseInt(quantityInput.value);
  if (totalMinted + qty > CONFIG.MAX_SUPPLY) {
    alert("Exceeds max supply!");
    return;
  }

  const solAmount = (CONFIG.PRICE_USD * qty) / 30; // rough SOL conversion (replace with live price API)
  const tx = new Transaction().add(
    SystemProgram.transfer({
      fromPubkey: window.solana.publicKey,
      toPubkey: new PublicKey(CONFIG.TREASURY_WALLET),
      lamports: Math.floor(solAmount * LAMPORTS_PER_SOL),
    })
  );

  try {
    const sig = await window.solana.sendTransaction(tx, window.solana);
    await window.solana.confirmTransaction(sig);
    totalMinted += qty;
    localStorage.setItem("softfundMinted", totalMinted);
    alert(`Minted ${qty} NFT(s)! Transaction: ${sig}`);
  } catch (err) {
    alert("Transaction failed: " + err.message);
  }
};
